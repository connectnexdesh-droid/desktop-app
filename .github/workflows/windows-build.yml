name: Windows Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore QuickDock.sln

      - name: Build
        run: dotnet build QuickDock.sln --configuration Release --no-restore

      - name: Publish Windows x64
        run: dotnet publish QuickDock/QuickDock.csproj --configuration Release --runtime win-x64 --self-contained true --output ./artifacts/QuickDock

      - name: Upload application artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuickDock-Windows-x64
          path: artifacts/QuickDock/
          if-no-files-found: error
